plugins {
    id 'com.android.application'
}

android {
    namespace 'eus.gerok.garajev3'
    compileSdk 36

    defaultConfig {
        applicationId 'eus.gerok.garajev3'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
}
