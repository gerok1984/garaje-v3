plugins {
    id 'com.android.application'
}

android {
    namespace 'eus.gerok.garajev4'
    compileSdk 36

    defaultConfig {
        applicationId 'eus.gerok.garajev4'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media:media:1.8.0'
}
